[build]
command = "cd engagebot && pnpm install && pnpm run build"
builder = "nixpacks"

[deploy]
startCommand = "cd engagebot && pnpm start"
workingDirectory = "engagebot"

[env]
NODE_ENV = "production"
NEXT_PUBLIC_APP_URL = "${RAILWAY_PUBLIC_DOMAIN}"
PORT = "3000"

[healthChecks]
path = "/api/health"
interval = "30s"
timeout = "10s"
retries = 3